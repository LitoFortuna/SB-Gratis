<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suazo Barber | Reserva tu Cita</title>
    <!-- Favicon & Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090d;
            --card-bg: rgba(15, 18, 26, 0.78);
            --text-primary: #ffffff;
            --text-secondary: #9aa3b8;
            --accent-blue: #00d2ff;
            --accent-blue-hover: #4de0ff;
            --accent-blue-deep: #0066ff;
            --blue-glow: rgba(0, 210, 255, 0.4);
            --border-color: rgba(0, 210, 255, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(0, 102, 255, 0.08) 0%, transparent 60%);
        }

        /* Efecto sutil de fondo */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#252830 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Sección principal centrada a pantalla completa */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 20px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 520px;
            padding: 48px 36px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 45px rgba(0, 210, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Icono de barbería */
        .brand-icon {
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #121622, #0c0f18);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 0 16px rgba(0, 210, 255, 0.15);
        }

        .brand-icon svg {
            width: 42px;
            height: 42px;
            stroke: var(--accent-blue);
            stroke-width: 1.6;
            fill: none;
        }

        /* Título */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 40%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-blue);
            font-weight: 500;
            margin-bottom: 36px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            margin: 0 auto 36px auto;
        }

        /* Botón de Reserva */
        .btn-reserve {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #060911;
            background: linear-gradient(135deg, #00f0ff 0%, #00a6ff 50%, #0066ff 100%);
            border: none;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px var(--blue-glow);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .btn-reserve:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 210, 255, 0.6);
            background: linear-gradient(135deg, #33f3ff 0%, #29b6ff 50%, #0077ff 100%);
        }

        .btn-reserve:active {
            transform: translateY(1px);
            box-shadow: 0 6px 15px rgba(0, 210, 255, 0.45);
        }

        .btn-reserve svg {
            width: 20px;
            height: 20px;
            stroke: #060911;
            stroke-width: 2.2;
            fill: none;
            transition: transform 0.3s ease;
        }

        .btn-reserve:hover svg {
            transform: translateX(3px);
        }

        .footer-info {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* Footer ultra discreto al final del scroll */
        .bottom-credit {
            width: 100%;
            text-align: center;
            padding: 120px 20px 30px 20px;
            font-size: 0.68rem;
            color: #161922;
            letter-spacing: 0.4px;
        }

        .bottom-credit a {
            color: #1c2230;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .bottom-credit a:hover {
            color: #2e374d;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
                border-radius: 20px;
            }

            h1 {
                font-size: 2.1rem;
            }

            .btn-reserve {
                padding: 16px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="hero-section">
        <main class="container">
            <!-- Icono Barbershop Tijeras / Navaja -->
            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="6" cy="6" r="3"></circle>
                    <circle cx="6" cy="18" r="3"></circle>
                    <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                    <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                    <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
                </svg>
            </div>

            <h1>Suazo Barber</h1>
            <p class="subtitle">Barcelona</p>
            <div class="divider"></div>

            <!-- Botón de reserva -->
            <a href="https://booksy.com/es-es/103249_suazo-barber_barberia_48863_barcelona#ba_s=seo" 
               class="btn-reserve" 
               target="_blank" 
               rel="noopener noreferrer">
                <span>Reservar Cita</span>
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <div class="footer-info">
                <p>Reserva fácil y rápida a través de Booksy</p>
            </div>
        </main>
    </div>

    <!-- Mención ultra discreta al final del scroll para rastreadores y motores de búsqueda -->
    <footer class="bottom-credit">
        <p>Diseño y optimización web por <a href="https://cerocaos.es" target="_blank" rel="noopener">CeroCaos</a></p>
    </footer>
</body>
</html>
